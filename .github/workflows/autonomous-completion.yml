name: Autonomous research completion

on:
  pull_request:
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  completion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [workflow, formal-scope, full-universe, long-horizon, continuous, account-purpose-owner, account-purpose-budget, account-purpose-runtime, account-purpose-runtime-authority, failed-account-owner, failed-account-budget, failed-account-context, failed-account-governance, failed-account-worker]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install frozen test dependencies
        run: python -m pip install --disable-pip-version-check --only-binary ":all:" --no-binary "pytdx" --require-hashes -r .github/workflows/requirements-p3b.txt
      - name: Record exact failed-account test source identities
        if: startsWith(matrix.suite, 'failed-account-')
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python -c "import hashlib,json,os,pathlib,subprocess,sys; root=pathlib.Path('.'); sources={str(p.as_posix()):hashlib.sha256(p.read_bytes()).hexdigest() for folder in ('src','scripts','tests') for p in sorted((root/folder).rglob('*.py'))}; value={'source_head':os.environ['SOURCE_HEAD'],'checkout_commit':subprocess.check_output(['git','-c','gc.auto=0','-c','maintenance.auto=false','rev-parse','HEAD'],text=True).strip(),'platform':sys.platform,'source_sha256':sources}; pathlib.Path('failed-account-source-identity.json').write_bytes((json.dumps(value,ensure_ascii=True,indent=2)+'\n').encode('utf-8'))"
      - name: Check generated capability documentation and public examples
        run: python scripts/generate_research_capabilities_v1.py --check
      - name: Select Git binary for bounded Windows workflow
        if: matrix.os == 'windows-latest' && matrix.suite == 'workflow'
        shell: pwsh
        run: |
          $originalGit = (Get-Command git -CommandType Application | Select-Object -First 1).Source
          $gitInstallation = Split-Path (Split-Path $originalGit -Parent) -Parent
          if ((Split-Path $gitInstallation -Leaf) -in @('ucrt64', 'mingw64')) {
            $gitInstallation = Split-Path $gitInstallation -Parent
          }
          # UCRT64 installs retain mingw64/bin/git.exe as a compatibility launcher.
          $candidates = @(
            (Join-Path $gitInstallation 'ucrt64/bin/git.exe'),
            (Join-Path $gitInstallation 'mingw64/bin/git.exe')
          )
          $directGit = $candidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $directGit) { throw 'Installed Git binary was not found' }
          $gitDirectory = Split-Path $directGit -Parent
          $env:PATH = $gitDirectory + [IO.Path]::PathSeparator + $env:PATH
          $gitDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $gitVersion = & $directGit -c gc.auto=0 -c maintenance.auto=false --version
          if ($LASTEXITCODE -ne 0) { throw 'Selected Git binary did not start' }
          @{ original_git = $originalGit; original_sha256 = (Get-FileHash -LiteralPath $originalGit -Algorithm SHA256).Hash; selected_git = $directGit; sha256 = (Get-FileHash -LiteralPath $directGit -Algorithm SHA256).Hash; version = $gitVersion } | ConvertTo-Json -Compress
          where.exe git
      - name: Verify new workflow and original entry contracts
        if: matrix.suite == 'workflow'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/trusted-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_research_capabilities_v1.py
          tests/research_factory/test_research_capabilities_docs_v1.py
          tests/research_factory/test_published_acceptance_v1.py
          tests/research_factory/test_research_rule_strategy_v3.py
          tests/research_factory/test_research_data_provider_v1.py
          tests/research_factory/test_dynamic_turn_dependencies_v3.py
          tests/research_factory/test_strategy_submission_v1.py
          tests/research_factory/test_strategy_submission_web_v1.py
          tests/research_factory/test_research_evidence_v1.py
          tests/research_factory/test_rule_exit_integration_v3.py
          tests/research_factory/test_research_benchmark_v1.py
          tests/research_factory/test_trusted_research_host_v1.py
          tests/research_factory/test_synthetic_batch_resources.py
          tests/research_factory/test_research_campaign_v1.py
          tests/research_factory/test_diagnosis_research_v3.py
          tests/research_factory/test_campaign_confirmation_v1.py
          tests/research_factory/test_formal_rule_adapter_v3.py
          tests/research_factory/test_public_strategy_archive_v3.py
          tests/research_factory/test_public_strategy_lifecycle_cli_v3.py
          tests/research_factory/test_trusted_daily_plan_v1.py
          tests/research_factory/test_trusted_research_system_v1.py
          tests/research_factory/test_bounded_model_v3.py
          tests/research_factory/test_strategy_account_reports_v3.py
          tests/research_factory/test_trusted_research_cli_v1.py
          tests/research_factory/test_research_data_qualification_v1.py
          tests/research_factory/test_validation_protocol_v2.py
          tests/research_factory/test_formal_evidence_v2.py
          tests/research_factory/test_method_applicability_v1.py
          tests/research_factory/test_research_rule_strategy_v2.py
          tests/research_factory/test_rule_account_backend_v2.py
          tests/research_factory/test_rule_paper_parity_v2.py
          tests/research_factory/test_multi_symbol_validation_runner_v2.py
          tests/research_factory/test_formal_cash_benchmark_v2.py
          tests/research_factory/test_bounded_rule_loop_v2.py
          tests/research_factory/test_diagnosis_research_v2.py
          tests/research_factory/test_corporate_action_lifecycle_v1.py
          tests/research_factory/test_portfolio_qualification_v1.py
          tests/research_factory/test_research_lifecycle_jobs_v1.py
          tests/research_factory/test_lifecycle_service_v2.py
          tests/research_factory/test_lifecycle_ui_launch_v2.py
          tests/research_factory/test_forward_paper_v1.py
          tests/research_factory/test_forward_observation_lifecycle_v2.py
          tests/research_factory/test_strategy_qualification_v1.py
          tests/research_factory/test_bounded_model_v1.py
          tests/research_factory/test_strategy_lifecycle_cli_v1.py
          --basetemp=${{ runner.temp }}/autonomous-completion-tests
          --junitxml=completion-tests.xml
      - name: Verify complete frozen formal-scope family
        if: matrix.suite == 'formal-scope'
        run: >-
          python -m pytest -q
          tests/research_factory/test_formal_rule_adapter_v2.py
          --basetemp=${{ runner.temp }}/formal-scope-tests
          --junitxml=completion-tests.xml
      - name: Verify continuous scope, two batches, public workers and independent boundary
        if: matrix.suite == 'continuous'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/continuous-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_continuous_research_contract_v1.py
          tests/research_factory/test_campaign_scope_v1.py
          tests/research_factory/test_report_repair_capability_bridge_v1.py
          tests/research_factory/test_report_repair_protocol_v1.py
          tests/research_factory/test_report_repair_runner_v1.py
          tests/research_factory/test_research_campaign_v1.py
          tests/research_factory/test_research_dataset_projection_v1.py
          tests/research_factory/test_train_projection_cli_v1.py
          tests/research_factory/test_train_projection_admission_v1.py
          tests/research_factory/test_bounded_model_v4.py
          tests/research_factory/test_universe_bounded_segments_v1.py
          tests/research_factory/test_continuous_submission_v1.py
          tests/research_factory/test_diagnosis_research_v4.py
          tests/research_factory/test_continuous_recovery_boundaries_v1.py
          tests/research_factory/test_continuous_storage_v1.py
          tests/research_factory/test_secure_file_reference_v1.py
          tests/research_factory/test_continuous_final_feedback_v1.py
          tests/research_factory/test_continuous_model_settlement_recovery_v1.py
          tests/research_factory/test_continuous_public_settlement_recovery_v1.py
          tests/research_factory/test_final_exploration_queue_v1.py
          tests/research_factory/test_business_validation_protocol_v1.py
          tests/research_factory/test_continuous_universe_lifecycle_v1.py
          tests/research_factory/test_continuous_universe_acceptance_v1.py
          tests/research_factory/test_account_version_capability_bridge_v1.py
          tests/research_factory/test_account_version_continuation_v1.py
          tests/research_factory/test_account_version_feedback_v1.py
          tests/research_factory/test_account_version_session_resume_v1.py
          tests/research_factory/test_account_version_setup_cli_v1.py
          tests/research_factory/test_account_version_public_integration_v1.py
          tests/research_factory/test_account_execution_guard_v1.py
          tests/research_factory/test_universe_coverage_initialization_v1.py
          --basetemp=${{ runner.temp }}/continuous-tests
          --junitxml=completion-tests.xml
      - name: Verify account purpose Owner proof and public setup
        if: matrix.suite == 'account-purpose-owner'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/purpose-owner-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_account_purpose_time_extension_v1.py
          tests/research_factory/test_account_purpose_time_extension_setup_cli_v1.py
          tests/research_factory/test_account_purpose_time_extension_integration_v1.py
          --basetemp=${{ runner.temp }}/purpose-owner-tests
          --junitxml=completion-tests.xml
      - name: Verify account purpose budget and mirror boundaries
        if: matrix.suite == 'account-purpose-budget'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/purpose-budget-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_account_purpose_time_budget_v1.py
          --basetemp=${{ runner.temp }}/purpose-budget-tests
          --junitxml=completion-tests.xml
      - name: Verify account purpose successor runtime and recovery
        if: matrix.suite == 'account-purpose-runtime'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/purpose-runtime-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_account_purpose_time_runtime_v1.py
          -k "not (aggregate or existing_repair_marker or combined_session)"
          --basetemp=${{ runner.temp }}/purpose-runtime-tests
          --junitxml=completion-tests.xml
      - name: Verify account purpose aggregate authority and prewrite checks
        if: matrix.suite == 'account-purpose-runtime-authority'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/purpose-authority-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_account_purpose_time_runtime_v1.py
          -k "aggregate or existing_repair_marker or combined_session"
          --basetemp=${{ runner.temp }}/purpose-authority-tests
          --junitxml=completion-tests.xml
      - name: Verify failed account recovery owner boundaries
        if: matrix.suite == 'failed-account-owner'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/failed-account-owner-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_failed_account_recovery_capability_v1.py
          tests/research_factory/test_failed_account_recovery_setup_v1.py
          tests/research_factory/test_failed_account_calendar_deadline_owner_v1.py
          --basetemp=${{ runner.temp }}/failed-account-owner-tests
          --junitxml=completion-tests.xml
      - name: Verify failed account recovery budget boundaries
        if: matrix.suite == 'failed-account-budget'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/failed-account-budget-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_failed_account_recovery_budget_v1.py
          tests/research_factory/test_failed_account_calendar_deadline_budget_v1.py
          --basetemp=${{ runner.temp }}/failed-account-budget-tests
          --junitxml=completion-tests.xml
      - name: Verify failed account recovery context boundaries
        if: matrix.suite == 'failed-account-context'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/failed-account-context-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_failed_account_recovery_context_v1.py
          tests/research_factory/test_failed_account_recovery_public_v1.py
          tests/research_factory/test_failed_account_calendar_scope_v1.py
          tests/research_factory/test_same_call_verification_v1.py
          tests/research_factory/test_verification_return_boundaries_v1.py
          tests/research_factory/test_recovery_read_equivalence_v1.py
          tests/research_factory/test_lexical_reference_cache_v1.py
          tests/research_factory/test_verified_json_resolvers_v1.py
          tests/research_factory/test_ci_pytest_resource_artifact_paths.py
          --basetemp=${{ runner.temp }}/failed-account-context-tests
          --junitxml=completion-tests.xml
      - name: Verify failed account recovery governance boundaries
        if: matrix.suite == 'failed-account-governance'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/failed-account-governance-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_failed_account_recovery_governance_v1.py
          tests/research_factory/test_failed_account_calendar_deadline_runtime_v1.py
          --basetemp=${{ runner.temp }}/failed-account-governance-tests
          --junitxml=completion-tests.xml
      - name: Verify failed account recovery worker boundaries
        if: matrix.suite == 'failed-account-worker'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/failed-account-worker-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_failed_account_recovery_worker_v1.py
          tests/research_factory/test_failed_account_recovery_evidence_v1.py
          --basetemp=${{ runner.temp }}/failed-account-worker-tests
          --junitxml=completion-tests.xml
      - name: Verify long-horizon public entry, continuation and independent evidence
        if: matrix.suite == 'long-horizon'
        env:
          CHANLUN_PROCESS_EVIDENCE_DIR: ${{ runner.temp }}/long-horizon-resource-evidence
        run: >-
          python -m pytest -q
          tests/research_factory/test_universe_execution_profile_v1.py
          tests/research_factory/test_universe_compute_governance_v1.py
          tests/research_factory/test_universe_execution_state_v2.py
          tests/research_factory/test_universe_checkpoint_atomic_replace_v1.py
          tests/research_factory/test_universe_streaming_execution_v1.py
          tests/research_factory/test_research_rule_strategy_v4.py
          tests/research_factory/test_universe_selection_v1.py
          tests/research_factory/test_portfolio_allocation_explanation_v1.py
          tests/research_factory/test_universe_signal_funnel_v1.py
          tests/research_factory/test_universe_evidence_v2.py
          tests/research_factory/test_universe_broker_rejection_priority_v2.py
          tests/research_factory/test_universe_independent_feature_continuation_v2.py
          tests/research_factory/test_universe_sparse_causal_price_v3.py
          tests/research_factory/test_universe_suspended_cash_valuation_v2.py
          tests/research_factory/test_universe_suspended_cash_allocation_v2.py
          tests/research_factory/test_universe_owned_inputs_v1.py
          tests/research_factory/test_universe_research_report_v2.py
          tests/research_factory/test_universe_report_continuation_v1.py
          tests/research_factory/test_long_horizon_public_submission_v1.py
          tests/research_factory/test_long_horizon_submission_web_v1.py
          tests/research_factory/test_long_horizon_acceptance_v1.py
          tests/research_factory/test_long_horizon_segment_evidence_v1.py
          tests/research_factory/test_long_horizon_failure_recovery_v1.py
          tests/research_factory/test_long_horizon_resources_v1.py
          tests/research_factory/test_long_horizon_cooperative_deadline_v1.py
          tests/research_factory/test_long_horizon_report_input_reuse_v1.py
          tests/research_factory/test_long_horizon_compute_cache_v1.py
          tests/research_factory/test_universe_campaign_segment_mirror_v1.py
          tests/research_factory/test_long_horizon_publication_v1.py
          tests/research_factory/test_baostock_raw_supplement_v1.py
          tests/research_factory/test_prepare_long_horizon_data_v1.py
          tests/research_factory/test_long_horizon_relative_references_v1.py
          --basetemp=${{ runner.temp }}/long-horizon-tests
          --junitxml=completion-tests.xml
      - name: Set up Node for long-horizon console regression
        if: matrix.suite == 'long-horizon'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify console tests and production build
        if: matrix.suite == 'long-horizon'
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - name: Verify full historical universe and shared account contracts
        if: matrix.suite == 'full-universe'
        run: >-
          python -m pytest -q
          tests/research_factory/test_research_universe_v1.py
          tests/research_factory/test_tdx_research_adapter_v1.py
          tests/research_factory/test_prepare_full_universe_data_v1.py
          tests/research_factory/test_baostock_universe_adapter_v1.py
          tests/research_factory/test_baostock_universe_parity_v1.py
          tests/research_factory/test_prepare_baostock_universe_data_v1.py
          tests/research_factory/test_prepare_missing_tdx_cache_v1.py
          tests/research_factory/test_universe_supplements_v1.py
          tests/research_factory/test_collect_universe_gaps_v1.py
          tests/research_factory/test_prepare_universe_collection_continuation_v1.py
          tests/research_factory/test_universe_actions_v1.py
          tests/research_factory/test_prepare_universe_actions_v2.py
          tests/research_factory/test_partial_share_terms_preparation_v2.py
          tests/research_factory/test_resolve_universe_numeric_terms_v1.py
          tests/research_factory/test_classify_universe_action_evidence_v1.py
          tests/research_factory/test_fetch_universe_action_announcements_v1.py
          tests/research_factory/test_resolve_universe_action_dates_v1.py
          tests/research_factory/test_corporate_action_price_v2.py
          tests/research_factory/test_universe_corporate_accounting_v2.py
          tests/research_factory/test_prepare_full_universe_states_v1.py
          tests/research_factory/test_universe_account_inputs_v1.py
          tests/research_factory/test_universe_frame_identity_memory_v1.py
          tests/research_factory/test_universe_dividend_accounting_v1.py
          tests/research_factory/test_board_execution_policy_v1.py
          tests/research_factory/test_universe_signal_scan_v1.py
          tests/research_factory/test_chinext_entry_parity_v1.py
          tests/research_factory/test_universe_account_backend_v1.py
          tests/research_factory/test_universe_execution_recovery_v1.py
          tests/research_factory/test_universe_public_recovery_v1.py
          tests/research_factory/test_universe_frozen_scope_v1.py
          tests/research_factory/test_universe_frozen_io_v1.py
          tests/research_factory/test_universe_evidence_v1.py
          tests/research_factory/test_universe_account_identity_v1.py
          tests/research_factory/test_universe_benchmark_v1.py
          tests/research_factory/test_universe_submission_v1.py
          tests/research_factory/test_universe_qualified_scope_v1.py
          tests/research_factory/test_universe_qualified_submission_v2.py
          tests/research_factory/test_universe_scan_service_v1.py
          tests/research_factory/test_universe_capabilities_v1.py
          tests/research_factory/test_full_universe_acceptance_v1.py
          tests/research_factory/test_universe_resources_v1.py
          --basetemp=${{ runner.temp }}/full-universe-tests
          --junitxml=completion-tests.xml
      - name: Locate retained pytest resource evidence
        id: pytest-evidence-paths
        if: always() && (startsWith(matrix.suite, 'failed-account-') || matrix.suite == 'full-universe' || (matrix.os == 'windows-latest' && matrix.suite == 'workflow'))
        run: python tests/ci/pytest_resource_artifact_paths.py --suite ${{ matrix.suite }}
      - name: Upload failed-account source and resource identities
        if: always() && startsWith(matrix.suite, 'failed-account-')
        uses: actions/upload-artifact@v4
        with:
          name: failed-account-evidence-${{ matrix.os }}-${{ matrix.suite }}
          path: ${{ steps.pytest-evidence-paths.outputs.paths }}
      - name: Upload Windows venv data worker evidence
        if: always() && matrix.os == 'windows-latest' && matrix.suite == 'workflow'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-venv-data-resource-${{ matrix.os }}
          path: ${{ steps.pytest-evidence-paths.outputs.paths }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: completion-${{ matrix.os }}-${{ matrix.suite }}
          path: completion-tests.xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.suite == 'full-universe'
        with:
          name: full-universe-resource-${{ matrix.os }}
          path: ${{ steps.pytest-evidence-paths.outputs.paths }}

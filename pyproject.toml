[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chanlun-trader"
version = "0.1.0"
description = "Chanlun research and backtest platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "real_data_integration: 需要真实本机数据（gbbq/.day）的集成测试；本任务禁止执行",
]
